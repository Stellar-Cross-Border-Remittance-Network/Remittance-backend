services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remittance
      POSTGRES_PASSWORD: remittance
      POSTGRES_DB: remittance
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remittance']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://remittance:remittance@postgres:5432/remittance
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  pgdata: